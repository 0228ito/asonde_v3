<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホを立てて置いてあそぶ</title>
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFBC10">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="app.css">
<script src="dc-lite.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=M+PLUS+Rounded+1c:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8ED3F7}a:hover{color:#BFE6FA}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #23283A; font-family: 'BIZ UDPGothic', sans-serif; color: #F5F5F5; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 36px; top: 150px; width: 10px; height: 10px; border-radius: 50%; background: #FFB3C8"></div>
  <div aria-hidden="true" style="position: absolute; left: 330px; top: 190px; width: 12px; height: 12px; border-radius: 3px; background: #A8D8FF; transform: rotate(20deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 60px; top: 400px; width: 8px; height: 8px; border-radius: 50%; background: #B8E8B8"></div>
  <div aria-hidden="true" style="position: absolute; left: 318px; top: 410px; width: 10px; height: 10px; border-radius: 50%; background: #FFE680"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding: 52px 24px 32px; gap: 24px; height: 100%; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 20px; font-weight: 800">
        <span style="{{dotStyle}}" aria-hidden="true"></span>{{statusLabel}}
      </div>
      <div style="font-size: 14px; color: #C9C9C9; text-align: center; line-height: 1.6">声かけとえがおは自動で記録されます。<br>画面はさわらなくて大丈夫です</div>
    </div>

    <div style="position: relative; width: 240px; height: 240px">
      <svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <circle cx="120" cy="120" r="104" fill="none" stroke="#3A4258" stroke-width="18"></circle>
        <circle cx="120" cy="120" r="104" fill="none" stroke="#FFBC10" stroke-width="18" stroke-linecap="round" stroke-dasharray="653.5" dc-stroke-dashoffset="{{dashOffset}}" transform="rotate(-90 120 120)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <div style="font-size: 15px; color: #C9C9C9">のこり</div>
        <div style="font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 56px; font-weight: 800" role="timer">{{timeLabel}}</div>
      </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 14px; font-weight: 700; color: #FFE680; padding: 0 6px">きょうのコツ</div>
      <div style="background: #313850; border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #A8D8FF; color: #222222; display: flex; align-items: center; justify-content: center; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800" aria-hidden="true">1</div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 700">お子さんの行動を言葉にする</div>
          <div style="font-size: 14px; color: #D6E9F5">「くるま、はしってるね」</div>
        </div>
      </div>
      <div style="background: #313850; border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
        <div style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: #FFB3C8; color: #222222; display: flex; align-items: center; justify-content: center; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800" aria-hidden="true">2</div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 16px; font-weight: 700">お子さんの動きを真似る</div>
          <div style="font-size: 14px; color: #D6E9F5">手をたたいたら、同じようにたたく</div>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center">
      <div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" onClick="{{togglePause}}" style="height: 60px; border-radius: 999px; border: 2px solid #C9C9C9; background: transparent; color: #F5F5F5; font-size: 17px; font-weight: 700; cursor: pointer">{{pauseLabel}}</button>
        <a href="Reflection.html" style="display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 999px; background: #FFBC10; color: #222222; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 #D99A00">おわる</a>
      </div>
      <div style="font-size: 14px; color: #C9C9C9; text-align: center; line-height: 1.6">途中でおわっても大丈夫。<br>そばにいた時間がいちばんです</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.total = 300;
    this.state = { left: 214, paused: false };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.paused) return;
      this.setState({ left: this.state.left > 0 ? this.state.left - 1 : this.total });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const left = this.state.left;
    const m = Math.floor(left / 60);
    const s = left % 60;
    const paused = this.state.paused;
    return {
      timeLabel: m + ':' + (s < 10 ? '0' : '') + s,
      dashOffset: String(653.5 * (1 - left / this.total)),
      statusLabel: paused ? 'いったん止めています' : 'みているよ・きいているよ',
      pauseLabel: paused ? 'つづける' : 'いったん止める',
      dotStyle: 'display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: ' + (paused ? '#8A8F9C' : '#FF7A6E'),
      togglePause: () => this.setState({ paused: !paused })
    };
  }
}
</script>
</body>
</html>
