<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>紹介からのウェルカム</title>
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFBC10">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="app.css">
<script src="dc-lite.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=M+PLUS+Rounded+1c:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1698D9}a:hover{color:#1176AD}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F8F8F8; font-family: 'BIZ UDPGothic', sans-serif; color: #333333; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 330px; background: #FFF6CC; border-radius: 0 0 56px 56px"></div>
  <div aria-hidden="true" style="position: absolute; left: 28px; top: 90px; width: 16px; height: 16px; border-radius: 50%; background: #FFB3C8"></div>
  <div aria-hidden="true" style="position: absolute; left: 330px; top: 110px; width: 18px; height: 18px; border-radius: 5px; background: #A8D8FF; transform: rotate(20deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 50px; top: 250px; width: 12px; height: 12px; border-radius: 3px; background: #B8E8B8; transform: rotate(-15deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: 320px; top: 260px; width: 12px; height: 12px; border-radius: 50%; background: #FFD0A0"></div>

  <div style="position: relative; display: flex; flex-direction: column; padding: 36px 24px 32px; gap: 20px; height: 100%; box-sizing: border-box">
    <div style="display: flex; justify-content: center">
      <div style="font-size: 14px; font-weight: 700; color: #5C4600; background: #FFFFFF; border-radius: 999px; padding: 6px 16px; box-shadow: 0 3px 0 #F2DFA6">{{centerName}}からのご紹介</div>
    </div>
    <div style="align-self: center; width: 210px; height: 210px; border-radius: 48px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #F2DFA6; transform: rotate(-3deg)">
      <img src="logo.png" alt="あそんでえがお" style="width: 200px; height: 200px; object-fit: contain">
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; text-align: center">
      <h1 style="margin: 0; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 27px; line-height: 1.45; font-weight: 800">おうちでできる、<br>親子のあそび時間</h1>
      <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #444444">受診までの間や、通うのがむずかしい日も。いつもの遊びに「ひとこと」足すところから、一緒にはじめましょう。</p>
    </div>
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <div style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: #A8D8FF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #FFFFFF" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="17" cy="9" r="2.4"></circle><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"></path><path d="M15 14.2c2.6-.3 4.8 1.2 5.5 4.3"></path></svg>
      </div>
      <div style="flex-grow: 1; background: #FFFFFF; border-radius: 6px 24px 24px 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 4px 0 #E6E6E6">
        <div style="font-size: 13px; color: #5C5C5C">あなたを見守るチーム　{{teamName}}</div>
        <div style="font-size: 15px; line-height: 1.7">がんばらなくて大丈夫。やれた日に、やれた分だけで十分です。</div>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: center">
      <a href="Consent.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 62px; border-radius: 999px; background: #FFBC10; color: #222222; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 20px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 #D99A00">はじめる</a>
      <div style="font-size: 14px; color: #5C5C5C">登録は1分ほど。いつでもやめられます</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"centerName":{"editor":"text","default":"◯◯市保健センター"},"teamName":{"editor":"text","default":"◯◯大学 ◯◯先生のチーム"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      centerName: this.props.centerName ?? '◯◯市保健センター',
      teamName: this.props.teamName ?? '◯◯大学 ◯◯先生のチーム'
    };
  }
}
</script>
</body>
</html>
