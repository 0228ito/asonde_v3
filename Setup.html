<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>あそびかたを選ぶ</title>
<meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFBC10">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="app.css">
<script src="dc-lite.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;family=M+PLUS+Rounded+1c:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1176AD}a:hover{color:#0E5F8B}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F8F8F8; font-family: 'BIZ UDPGothic', sans-serif; color: #333333; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 16px">
  <div style="height: 44px; display: flex; align-items: center">
    <a href="Home.html" aria-label="もどる" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 0 #E6E6E6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
    <h1 style="margin: 0; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 26px; font-weight: 800">どうやってあそぶ？</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #5C5C5C">どちらでも、声かけとお子さんのえがおが記録されます</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
      <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.style}}">
        <span style="{{m.iconStyle}}" aria-hidden="true">
          <sc-if value="{{m.isAr}}" hint-placeholder-val="{{ true }}">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#333333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="7" r="2.6" fill="#333333"></circle><circle cx="17.5" cy="7" r="2.6" fill="#333333"></circle><circle cx="12" cy="13" r="6.5"></circle><ellipse cx="9.6" cy="12.5" rx="1.5" ry="1.9" fill="#333333"></ellipse><ellipse cx="14.4" cy="12.5" rx="1.5" ry="1.9" fill="#333333"></ellipse><path d="M10.8 16.2c.8.6 1.6.6 2.4 0" fill="none"></path></svg>
          </sc-if>
          <sc-if value="{{m.isStand}}" hint-placeholder-val="{{ false }}">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="#FFFFFF" stroke="#333333" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2.5" width="8" height="14" rx="1.6"></rect><circle cx="12" cy="5.2" r=".8" fill="#333333"></circle><path d="M9 16.5l-3 5M15 16.5l3 5M5 21.5h14" fill="none"></path></svg>
          </sc-if>
        </span>
        <span style="display: flex; flex-direction: column; gap: 4px; text-align: left; flex-grow: 1">
          <span style="font-size: 17px; font-weight: 700">{{m.title}}</span>
          <span style="font-size: 14px; line-height: 1.6; color: #444444">{{m.desc}}</span>
        </span>
        <span style="{{m.radio}}" aria-hidden="true">
          <sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          </sc-if>
        </span>
      </button>
    </sc-for>
  </div>

  <div style="background: #FFF6CC; border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 0 #F2DFA6">
    <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; background: #FFBC10; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1" aria-hidden="true">
      <span style="font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 22px; font-weight: 800; color: #222222">5</span><span style="font-size: 11px; font-weight: 700; color: #222222">分</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 16px; font-weight: 700; color: #5C4600">あそぶ時間は5分です</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5C4600">体調がすぐれないときは、途中でおわっても大丈夫です。</p>
    </div>
  </div>

  <div style="display: flex; gap: 10px; align-items: flex-start">
    <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #FFB3C8; display: flex; align-items: center; justify-content: center" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
    </div>
    <div style="flex-grow: 1; background: #FFFFFF; border-radius: 6px 22px 22px 22px; padding: 12px 14px; box-shadow: 0 3px 0 #E6E6E6">
      <sc-if value="{{isArSel}}" hint-placeholder-val="{{ true }}">
        <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #444444">前回の「パンダさん」がまっています。お子さんが画面を見なくても大丈夫。そばで声をかけるだけで十分です。</p>
      </sc-if>
      <sc-if value="{{isStandSel}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #444444">1〜2mくらい先に、お子さんの顔が映るように立てて置いてください。テレビを消すと、声がよく聞こえます。</p>
      </sc-if>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <a href="Recording.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 62px; border-radius: 999px; background: #FFBC10; color: #222222; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 21px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 #D99A00">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#222222" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
    あそぶ
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'ar' };
  }
  renderVals() {
    const defs = [
      { id: 'ar', title: 'ARどうぶつ園であそぶ', desc: 'お部屋にどうぶつさんが出てきます', bg: '#FFF6CC' },
      { id: 'stand', title: 'スマホを立てて置いてあそぶ', desc: 'いつものおもちゃで。画面には何も出ないので、小さなお子さんにも', bg: '#E3F4FD' }
    ];
    const iconBg = { ar: '#FFE680', stand: '#A8D8FF' };
    const modes = defs.map((d) => {
      const on = this.state.mode === d.id;
      return {
        title: d.title, desc: d.desc, on,
        isAr: d.id === 'ar', isStand: d.id === 'stand',
        pressed: on ? 'true' : 'false',
        pick: () => this.setState({ mode: d.id }),
        style: 'display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 26px; cursor: pointer; color: #333333; background: ' + (on ? d.bg : '#FFFFFF') + '; border: ' + (on ? '3px solid #1698D9' : '3px solid transparent') + '; box-shadow: 0 4px 0 ' + (on ? '#BFE3F5' : '#E6E6E6'),
        iconStyle: 'width: 60px; height: 60px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: ' + iconBg[d.id],
        radio: 'flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: #1698D9; border: 2px solid #1698D9' : 'background: #FFFFFF; border: 2px solid #858585')
      };
    });
    return {
      modes,
      isArSel: this.state.mode === 'ar',
      isStandSel: this.state.mode === 'stand'
    };
  }
}
</script>
</body>
</html>
